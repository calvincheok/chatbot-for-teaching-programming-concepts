<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
</head>
<body>
  <header class="bar">
    <button class="home" id="homeBtn" type="button" aria-label="Python Tutor, back to all topics">Python Tutor</button>
    <span class="fake-chip" id="fakeChip" hidden title="Prototype: replies are pre-written test content, not a real AI model.">Fake tutor</span>
  </header>

  <!-- Topic list -->
  <main class="start" id="startView">
    <h1>What would you like to learn?</h1>
    <p class="lead">Pick a topic. I'll ask a few quick questions first, explain it at your level, then check you've got it.</p>
    <ul class="topics" id="topicList"></ul>
    <p class="storage-note" id="storageNote" hidden></p>
  </main>

  <!-- Lesson -->
  <main class="chat" id="chatView" hidden>
    <div class="sticky-head">
      <div class="chat-top">
        <button type="button" class="back" id="backBtn"><span aria-hidden="true">&larr;</span> All topics</button>
        <span class="chat-title" id="chatTitle"></span>
        <span class="saved" title="You can leave at any time and continue later.">Progress saved</span>
      </div>
      <nav class="track" id="track" aria-label="Lesson progress"></nav>
      <div class="level" id="levelNote" hidden></div>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <section class="finish" id="finishCard" hidden></section>
    <div class="quick" id="quick"></div>
    <div class="failed" id="failed" role="alert" hidden>
      <span id="failedText"></span>
      <button type="button" id="retryBtn">Send again</button>
    </div>
    <form class="composer" id="composer">
      <label class="sr-only" for="input">Your message</label>
      <textarea id="input" rows="1" maxlength="1000" placeholder="Type your answer..."></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
    <p class="hint">Enter to send, Shift + Enter for a new line</p>
  </main>

  <footer class="site-note" id="siteNote" hidden></footer>

  <!-- backend -->
  <script src="{{ url_for('static', filename='backend-server.js') }}"></script>
  <!-- /backend -->
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
